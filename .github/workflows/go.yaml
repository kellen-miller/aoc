name: Go
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: go-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  detect-changes:
    name: Change detection
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.paths.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: paths
        uses: kellen-miller/ci/.github/actions/changed-paths@6d83b6c0e8b6f407fa2f11e1c974449649cfa1f6
        with:
          filters: |
            {
              "go": [
                ".github/workflows/**",
                ".github/actions/**",
                "go.mod",
                "go.sum",
                "go.work",
                "go.work.sum",
                "**/*.go",
                "cmd/**",
                "internal/**",
                "pkg/**",
                "testdata/**",
                "fixtures/**",
                "scripts/**",
                ".golangci*",
                "Taskfile*",
                "Makefile",
                "languages/go/**",
                "templates/**",
                "**/testdata/**",
                "**/fixtures/**"
              ]
            }

  package-tests-build:
    name: languages/go
    needs: detect-changes
    if: ${{ !cancelled() && (needs.detect-changes.result != 'success' || fromJSON(needs.detect-changes.outputs.changes).go) }}
    uses: kellen-miller/ci/.github/workflows/go-test.yaml@c188397b9147dbf21030cf2f3e4fc41bff37358b
    with:
      check-name: Package tests and build
      go-version-file: go.mod
      # Solver tests require ignored local puzzle inputs.
      test-packages: ./languages/go/pkg/...
      vet: true
      build-target: ./...

  static-analysis:
    name: Static analysis
    needs: detect-changes
    if: ${{ !cancelled() && (needs.detect-changes.result != 'success' || fromJSON(needs.detect-changes.outputs.changes).go) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: kellen-miller/ci/.github/actions/go-lint@6d83b6c0e8b6f407fa2f11e1c974449649cfa1f6
        with:
          go-version-file: go.mod
