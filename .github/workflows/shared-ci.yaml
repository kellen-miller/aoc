name: Shared CI
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: shared-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.paths.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: paths
        uses: kellen-miller/ci/.github/actions/changed-paths@6d83b6c0e8b6f407fa2f11e1c974449649cfa1f6
        with:
          filters: |
            {
              "go": [
                ".github/workflows/**",
                ".github/actions/**",
                "go.mod",
                "go.sum",
                "go.work",
                "go.work.sum",
                "**/*.go",
                "cmd/**",
                "internal/**",
                "pkg/**",
                "testdata/**",
                "fixtures/**",
                "scripts/**",
                ".golangci*",
                "Taskfile*",
                "Makefile",
                "languages/go/**",
                "templates/**",
                "**/testdata/**",
                "**/fixtures/**"
              ]
            }

  workflows:
    name: GitHub Actions
    uses: kellen-miller/ci/.github/workflows/gh-actions-lint.yaml@eb1a4f5900aaa6468cffb67513da61078265ba26
  renovate:
    name: Renovate
    uses: kellen-miller/ci/.github/workflows/renovate-config-validator.yaml@eb1a4f5900aaa6468cffb67513da61078265ba26
  go:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.changes).go) }}
    uses: kellen-miller/ci/.github/workflows/go-test.yaml@6d83b6c0e8b6f407fa2f11e1c974449649cfa1f6
    with:
      go-version-file: go.mod
      # Solver tests require ignored local puzzle inputs.
      test-packages: ./languages/go/pkg/...
      vet: true
      build-target: ./...

  go-lint:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.changes).go) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: kellen-miller/ci/.github/actions/go-lint@6d83b6c0e8b6f407fa2f11e1c974449649cfa1f6
        with:
          go-version-file: go.mod

  duplication:
    name: Code duplication (CPD)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: kellen-miller/ci/.github/actions/code-duplication@eb1a4f5900aaa6468cffb67513da61078265ba26
